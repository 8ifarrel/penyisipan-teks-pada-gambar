{% extends "base.html" %}
{% block title %}Sisipkan Teks{% endblock %}

{% block content %}
  <div class="page-header">
    <h1>Sisipkan Teks</h1>
    <p>
      Sisipkan teks ke dalam citra digital dengan pengamanan AES-GCM
      dan steganografi LSB.
    </p>
  </div>

  <form class="card" method="post" enctype="multipart/form-data">
    <div class="form-field">
      <label for="cover_image">Unggah Foto</label>
      <p class="form-field__hint">
        Foto harus berformat PNG dan bermodel warna RGB 24-bit
      </p>

      <div class="file-field">
        <input type="file" id="cover_image" name="cover_image"
          class="file-field__input" accept="image/png" required>
        <label for="cover_image"
          class="file-field__button">Pilih Foto</label>
        <span class="file-field__name" data-file-name>
          Tidak ada file dipilih
        </span>
      </div>
    </div>

    <div class="form-field">
      <label for="text">Teks</label>
      <textarea id="text" name="text"
        placeholder="Tulis teks yang ingin disisipkan..."
        required></textarea>
    </div>

    <button type="submit" class="btn btn-block">Sisipkan Teks</button>
  </form>
{% endblock %}
